[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-video-editor"
version = "0.1.2"
description = "AI-powered CLI tool for automatic talking-head video editing"
requires-python = ">=3.11,<3.14"  # torch / faster-whisper wheels are not yet published for 3.14
dependencies = [
    # CLI + config
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    # HTTP client for OpenRouter
    "httpx>=0.27.0",
    # ML / analysis
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "faster-whisper>=1.0.0",
    # MCP server (1.x API: FastMCP)
    "mcp>=1.0.0,<2",
    # AI Director providers
    "anthropic>=1.0.0",
    "openai>=1.0.0",
    # Free online text-to-speech for the voiceover step (Microsoft Edge voices)
    "edge-tts>=7.0",
]

[project.optional-dependencies]
gui = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
# Offline text-to-speech (Kokoro-82M, CPU). Also needs `apt install espeak-ng`.
tts-local = [
    "kokoro>=0.9",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ai-video-editor = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
