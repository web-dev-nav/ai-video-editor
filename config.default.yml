whisper:
  model: large-v3
  language: auto          # auto-detect, or "en", "ru", "hi"
  device: cpu             # cpu for CTranslate2 on Apple Silicon

silence:
  min_silence_ms: 500     # minimum silence duration to remove
  padding_ms: 100         # keep this much audio before/after speech
  crossfade_ms: 20        # crossfade at splice points (reserved; not yet used by pipeline)
  min_gap_sec: 2.0        # merge adjacent speech segments if gap is shorter than this
  padding_sec: 0.5        # breathing room added before/after every cut point

restarts:
  enabled: true
  trigger_phrases:
    - "cut cut"
    - "кат кат"
    - "कट कट"
  detect_repeated_starts: true   # auto-detect sentence restarts
  max_burst_duration_sec: 2.0   # remove short isolated speech segments (restarts, coughs)

fillers:
  enabled: true
  min_filler_duration_sec: 0.0   # skip filler words shorter than this (0.0 = remove all detected fillers)
  words:
    en: ["um", "uh", "like", "you know", "basically", "literally"]
    ru: ["ну", "типа", "вот", "короче", "как бы", "в общем", "эээ", "ээ"]
    hi: ["मतलब", "यानी", "अम्म", "उम्म", "हम्म", "एक्चुअली", "बेसिकली", "matlab", "yaani", "umm", "hmm"]

audio:
  enabled: false          # disabled by default; enable via --config override
  denoise: true
  denoise_level: -25      # afftdn noise floor (dB)
  highpass_freq: 80       # Hz
  deess_freq: 6000        # Hz
  deess_gain: -4          # dB reduction
  compressor_threshold: -18   # dB
  compressor_ratio: 3
  limiter_limit: -1       # dB
  loudness_target: -14    # LUFS (YouTube standard)

video:
  lut_path: null          # path to .cube LUT file, null = skip

hook:
  enabled: true
  duration_sec: 8         # target hook duration
  crossfade_sec: 0.5      # transition between hook and main content
  provider: null          # anthropic | openai | openrouter | nvidia — null = same as director
  model: null             # null = the director's model (same provider) or the provider default

chapters:
  enabled: true
  provider: null          # null = same as director
  model: null

director:
  enabled: false          # AI Director: an LLM decides what content to keep from your instructions
  provider: anthropic     # anthropic | openai | openrouter (keys: ANTHROPIC_API_KEY / OPENAI_API_KEY / OPENROUTER_API_KEY)
  model: claude-opus-5    # provider-specific model id
  mode: ai                # ai = the model judges every word (fillers, repeats, stalls) — no word lists; refine = model picks content on top of the rule-based cut; full = model ranges as-is
  skill: clean            # editing skill from skills/*.md: clean | film-director | youtube-retention | shorts | tutorial | interview
  skill_brief: ""         # override the skill's brief for this run (the GUI's "Style → ⓘ → Use this brief"); empty = use skills/<skill>.md
  instructions: ""        # e.g. "cut to under 60s, drop the tangent about the weather"
  boundary_padding_sec: 0.15

voiceover:
  enabled: false          # text-to-speech narration mixed into the edited video
  engine: edge            # openai (needs OPENAI_API_KEY) | edge (free, online) | kokoro (free, offline; pip install -e ".[tts-local]")
  model: gpt-4o-mini-tts  # openai only: gpt-4o-mini-tts | tts-1-hd | tts-1
  voice: en-US-AriaNeural # engine-specific voice id (openai: nova, alloy…; edge: en-US-AriaNeural…; kokoro: af_heart…)
  speed: 1.0
  instructions: "Warm, natural, conversational delivery like a friendly YouTuber. Natural pacing with short pauses at commas and sentence ends. Not a newsreader."
  mix_mode: narrate       # narrate = original voice ducked under each cue | replace = original muted while a cue plays
  fit: tempo              # when a clip is longer than its slot: tempo (speed up ≤ max_tempo) | overrun | none
  max_tempo: 1.3
  gain_db: 0
  duck_original_db: -12   # narrate mode: how far the original drops under the voiceover
  cues: []                # [{start, end?, text, voice?, speed?, instructions?, audio?}] — start is on the EDITED timeline
  cues_file: null         # alternative: JSON file with the cue list (CLI --vo-cues)
  cache_dir: null         # synthesized clips are cached here (defaults to the work dir)

music:
  enabled: false
  path: null              # audio file (mp3/wav/m4a/ogg/flac)
  gain_db: -18
  fade_in_sec: 2
  fade_out_sec: 3
  start_offset_sec: 0     # skip this much of the music file
  loop: true              # repeat to fill the video
  duck: true              # lower the music under speech / voiceover
  duck_db: -12

mix:
  original_gain_db: 0     # gain on the original voice track
  loudnorm: false         # normalise the final mix to loudness_target LUFS
  loudness_target: -14

encoding:
  codec: h264_videotoolbox    # macOS hardware encoder
  quality: 65                 # VideoToolbox quality (0-100, higher = better)
  audio_codec: aac
  audio_bitrate: "192k"
